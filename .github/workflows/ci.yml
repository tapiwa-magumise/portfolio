name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The text version is generated from data.js, console.js and console-data.js; fail if it is stale
      - name: Text version is up to date
        run: |
          node scripts/build_outline.mjs
          git diff --exit-code -- index.html || { echo "::error::Run 'npm run outline' and commit index.html"; exit 1; }

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
