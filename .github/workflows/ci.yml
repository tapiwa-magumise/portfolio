name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The text version is generated from data.js, console.js and console-data.js; fail if it is stale
      - name: Text version is up to date
        run: |
          node scripts/build_outline.mjs
          git diff --exit-code -- index.html || { echo "::error::Run 'npm run outline' and commit index.html"; exit 1; }

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Published only after the tests pass. Only the site's own files go out, not the tests or tooling.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html favicon.svg styles.css console.css app.js data.js console-data.js console.js search.js assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
